<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sin conexión — Dulce Patata Food</title>
<style>
  :root {
    --cream: #FFF8EE;
    --warm: #F5E6C8;
    --brown: #3D1F0D;
    --text: #2A1506;
    --muted: #8A6A4E;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--cream);
    color: var(--text);
    font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  .wrap {
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 32px 24px;
  }
  img.logo {
    width: 88px;
    height: 88px;
    border-radius: 20px;
    margin-bottom: 20px;
    box-shadow: 0 4px 16px rgba(61,31,13,0.15);
  }
  h1 {
    font-size: 21px;
    margin: 0 0 10px;
    color: var(--brown);
  }
  p {
    font-size: 14.5px;
    color: var(--muted);
    max-width: 320px;
    line-height: 1.5;
    margin: 0 0 4px;
  }
  .aviso-pedido {
    background: var(--warm);
    border-radius: 12px;
    padding: 12px 16px;
    margin-top: 18px;
    font-size: 13px;
    color: var(--text);
    max-width: 320px;
  }
  button {
    margin-top: 26px;
    background: var(--brown);
    color: var(--cream);
    border: none;
    border-radius: 12px;
    padding: 13px 28px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
  }
  button:active { opacity: 0.85; }
  .estado {
    margin-top: 14px;
    font-size: 12px;
    color: var(--muted);
  }
</style>
</head>
<body>
<div class="wrap">
  <img class="logo" src="img/logo.png" alt="Dulce Patata Food" onerror="this.style.display='none'">
  <h1>📶 Sin conexión</h1>
  <p>Parece que el móvil o la tablet se han quedado sin internet un momento.</p>
  <div class="aviso-pedido">
    Si ya habías confirmado un pedido antes de perder la conexión, tranquilo/a — se guardó bien. Esto solo afecta a la página que se está intentando cargar ahora mismo.
  </div>
  <button onclick="location.reload()">Reintentar</button>
  <div class="estado" id="estado-conexion">Esperando conexión…</div>
</div>
<script>
  function actualizarEstado() {
    var el = document.getElementById('estado-conexion');
    if (!el) return;
    if (navigator.onLine) {
      el.textContent = '✅ Conexión recuperada — recargando…';
      setTimeout(function () { location.reload(); }, 600);
    } else {
      el.textContent = 'Esperando conexión…';
    }
  }
  window.addEventListener('online', actualizarEstado);
  actualizarEstado();
</script>
</body>
</html>
